; polybar, as the status bar for the variant that uses one.
;
; Colors come from Xresources, which xinit/xinitrc.dwm loads from the pywal
; cache. polybar re-reads them on `polybar-msg cmd restart`, so a wallpaper
; change repaints the bar without a rebuild. dwm cannot do that: its palette is
; compiled in.
;
; Two dwm limitations shape this file.
;
; polybar cannot read dwm's tags. dwm sets no _NET_CURRENT_DESKTOP, so the
; xworkspaces module stays empty and there is no supported way to ask dwm which
; tags are occupied. Reading tag state needs the dwm-ipc patch and the matching
; polybar fork. dwm's own bar is left on for the tags, the layout symbol and
; the systray, and this one sits along the bottom.
;
; dwm also ignores _NET_WM_STRUT, so it will not reserve space for an external
; bar. Without override-redirect below, dwm manages polybar as an ordinary
; client and tiles it. With it, dwm leaves polybar alone but still lays windows
; out over the full screen, so the bottom 27 pixels of the lowest window sit
; behind this bar. Reserving that space needs a dwm patch.

[colors]
background = ${xrdb:background:#091a34}
foreground = ${xrdb:color7:#d3dae3}
accent     = ${xrdb:color4:#1a5598}
muted      = ${xrdb:color8:#5a5a5a}
urgent     = ${xrdb:color1:#d35f5f}

[bar/main]
bottom = true
override-redirect = true
width = 100%
height = 27
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2

font-0 = Hack Nerd Font:size=8;2

padding-left = 1
padding-right = 1
module-margin = 2

modules-left = cpu memory temperature
modules-center = mpris
modules-right = pomodoro caffeine pulseaudio battery weather date

cursor-click = pointer
cursor-scroll = ns-resize

; Internal modules. Each replaces a widget the awesome config writes by hand,
; and a script the dwmblocks variant needs.
;
; The accent-coloured label goes in format-prefix rather than an inline %{F}
; tag, because a tag written into `label` is not re-parsed after the ${colors}
; substitution and the closing brace ends up in the output.

[module/cpu]
type = internal/cpu
interval = 2
format = <label> <ramp-load>
format-prefix = "CPU "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%
ramp-load-0 = ▁
ramp-load-1 = ▂
ramp-load-2 = ▃
ramp-load-3 = ▄
ramp-load-4 = ▅
ramp-load-5 = ▆
ramp-load-6 = ▇
ramp-load-7 = █

[module/memory]
type = internal/memory
interval = 5
format = <label> <ramp-used>
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent}
label = %gb_used%
ramp-used-0 = ▁
ramp-used-1 = ▂
ramp-used-2 = ▃
ramp-used-3 = ▄
ramp-used-4 = ▅
ramp-used-5 = ▆
ramp-used-6 = ▇
ramp-used-7 = █

[module/temperature]
type = internal/temperature
interval = 7
thermal-zone = 0
warn-temperature = 80
format = <label>
format-foreground = ${colors.accent}
format-warn = <label-warn>
format-warn-foreground = ${colors.urgent}
label = %temperature-c%
label-warn = %temperature-c%

[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <label-volume>
format-volume-prefix = "Vol: "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted = Vol: muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 61
low-at = 15
format-charging = <label-charging>
format-charging-prefix = "Bat: "
format-charging-prefix-foreground = ${colors.accent}
format-discharging = <label-discharging>
format-discharging-prefix = "Bat: "
format-discharging-prefix-foreground = ${colors.accent}
format-full = <label-full>
format-full-prefix = "Bat: "
format-full-prefix-foreground = ${colors.accent}
format-low = <label-low>
format-low-foreground = ${colors.urgent}
label-charging = +%percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = Bat: %percentage%%

[module/date]
type = internal/date
interval = 30
date = %a %b %d, %I:%M %p
label = %date%
label-foreground = ${colors.accent}

; Script modules, for the widgets polybar has no internal equivalent of. These
; are the same bin/ scripts the dwmblocks variant runs, with DWM_BAR selecting
; the polybar colour markup.

[module/pomodoro]
type = custom/script
exec = DWM_BAR=polybar dwm-pomodoro
interval = 1
click-left = dwm-pomodoro toggle
click-right = dwm-pomodoro toggle-visible
click-middle = dwm-pomodoro skip

[module/caffeine]
type = custom/script
exec = DWM_BAR=polybar dwm-caffeine
interval = 30
click-left = dwm-caffeine toggle

[module/mpris]
type = custom/script
exec = DWM_BAR=polybar dwm-mpris
interval = 3
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

[module/weather]
type = custom/script
exec = DWM_BAR=polybar dwm-weather
interval = 900

[settings]
screenchange-reload = true
