# Idle handling. Replaces xss-lock, and the `xset s 300` that install/common/gui.sh runs
# to set the timeout.
#
# The caffeine widget inhibits this through a systemd idle inhibitor rather than by
# talking to hypridle directly, so anything else that takes one - a video player, say -
# suppresses the lock too. See waybar/scripts/caffeine.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

# 300s, matching the xset timeout the installer sets.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off a minute after locking.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}
