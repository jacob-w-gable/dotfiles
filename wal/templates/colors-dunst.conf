# Generated by pywal. Copied to ~/.config/dunst/dunstrc.d/99-wal.conf by
# hypr/scripts/wallpaper, where dunst reads it after dunstrc and so overrides the
# colours there.
#
# The b3 suffix is the "popup" alpha level from awesome/theme/alpha.lua - 70% opaque,
# the same value naughty uses for notification backgrounds.

[urgency_low]
    background = "{background}b3"
    foreground = "{color4}"
    frame_color = "{color4}b3"

[urgency_normal]
    background = "{background}b3"
    foreground = "{color4}"
    frame_color = "{color4}b3"

[urgency_critical]
    background = "{background}b3"
    foreground = "{color4}"
    frame_color = "{color4}b3"
