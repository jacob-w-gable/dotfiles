# Have systemd-oomd watch each user's session. When every task in it has been
# stalled on memory more than half the time for 20 seconds (oomd's default
# DefaultMemoryPressureDurationSec), it kills the application scope reclaiming
# the most memory. Ubuntu and Fedora ship these same values. Arch ships none.
#
# Installed by install/common/gui.sh as a root-owned copy. A symlink into the
# home directory would let an unprivileged edit change the system manager's
# configuration.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
