# The WACF2200 AES panel exposes its pen and its finger-touch as separate
# kernel devices. xf86-input-wacom claims both, and drives the pen correctly,
# but never emits XI2 touch events for the touch device -- `xinput test-xi2
# --root` shows ButtonPress/ButtonRelease from the pen and zero TouchBegin from
# finger touch, even with the driver's own `Touch` property set to on.
#
# Hand only the touch device to libinput, which does emit proper touch events.
# The Stylus/eraser devices are left on the wacom driver so pressure and the
# eraser tip keep working.
Section "InputClass"
    Identifier "WACF2200 touchscreen to libinput"
    MatchProduct "WACF2200:00 056A:5215 Touchscreen"
    MatchIsTouchscreen "on"
    Driver "libinput"
EndSection
