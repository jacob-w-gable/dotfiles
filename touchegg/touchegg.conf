<touchégg>

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <application name="All">

    <!-- Touchegg's minimum for a swipe is 3 fingers on touchpads but 2 on
         touchscreens, so these 2-finger gestures are effectively
         touchscreen-only: the touchpad ignores them, and touch scrolling is
         a 1-finger drag, so 2 fingers are free. -->
    <gesture type="SWIPE" fingers="2" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super</modifiers>
        <keys>KEY_J</keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super</modifiers>
        <keys>KEY_K</keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show drun</command>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show window</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Cycle focused window (matches Mod4+j / Mod4+k, useful with the
         fullscreen tag layout tablet mode switches to) -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super</modifiers>
        <keys>KEY_J</keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super</modifiers>
        <keys>KEY_K</keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- App launcher -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show drun</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Window switcher (rough "overview") -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show window</command>
        <on>begin</on>
      </action>
    </gesture>

    <!-- Close focused window (matches Mod4+Shift+c) -->
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Super+Shift</modifiers>
        <keys>KEY_C</keys>
        <on>begin</on>
      </action>
    </gesture>

  </application>

</touchégg>
