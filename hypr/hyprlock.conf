# Lock screen. Replaces the i3lock-color invocation built in awesome/config/apps.lua.
#
# That one passes colours as command-line flags because i3lock has no config file, and
# --custom-key-commands so media keys keep working while locked. hyprlock reads a config
# instead, and media keys are handled by the `locked` flag on the bindings themselves -
# see hypr/bindings/global.lua.
#
# Colours are literals here rather than pywal's: hyprlock is what you see when you
# cannot get at a shell, so it should not depend on a generated file being intact.

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/awesome/theme/lockscreen.png
    blur_passes = 2
    blur_size = 6
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    outline_thickness = 2
    dots_center = true

    outer_color = rgb(1a5598)
    inner_color = rgb(091a34)
    font_color = rgb(d3dae3)
    check_color = rgb(1a5598)
    fail_color = rgb(a04040)

    placeholder_text = <i>Password</i>
    fail_text = Incorrect
}

# %H:%M and "%A, %Y-%m-%d", the same formats the i3lock command asks for.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 64
    color = rgb(d3dae3)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %Y-%m-%d')"
    font_size = 18
    color = rgb(1a5598)
    position = 0, 20
    halign = center
    valign = center
}
