# Keep systemd-oomd from killing session services (dbus, pipewire, wireplumber,
# portals, gpg-agent) under memory pressure. Killing them takes the login
# session down. Applications run as scopes, which this does not match, so they
# stay candidates and oomd can relieve pressure by closing one of them. awesome
# launches the terminal and launcher in scopes for that reason, see
# awesome/config/apps.lua.
[Service]
ManagedOOMPreference=avoid
